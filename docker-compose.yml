services:
  postgres:
    image: postgres:16-alpine
    environment:
      {
        POSTGRES_USER: vnsf,
        POSTGRES_PASSWORD: vnsf_dev_only,
        POSTGRES_DB: vnsf,
      }
    ports: ["5432:5432"]
    volumes:
      [
        postgres_data:/var/lib/postgresql/data,
        ./infra/docker/postgres:/docker-entrypoint-initdb.d:ro,
      ]
    healthcheck:
      {
        test: [CMD-SHELL, "pg_isready -U vnsf"],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      { MINIO_ROOT_USER: vnsf-local, MINIO_ROOT_PASSWORD: replace-local-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
    volumes: [clamav_data:/var/lib/clamav]
  api:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: api }
    env_file: [.env]
    ports: ["3000:3000"]
    depends_on:
      {
        postgres: { condition: service_healthy },
        redis: { condition: service_started },
      }
  worker:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: worker }
    env_file: [.env]
    depends_on:
      {
        postgres: { condition: service_healthy },
        redis: { condition: service_started },
      }
  web:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: web }
    ports: ["5173:8080"]
    depends_on: [api]
volumes: { postgres_data: {}, redis_data: {}, minio_data: {}, clamav_data: {} }
