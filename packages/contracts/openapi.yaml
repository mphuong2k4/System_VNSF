openapi: 3.1.0
info:
  title: VNSF Scholarship Management API
  version: 0.1.0
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
servers:
  - url: /api/v1
security: [{ sessionCookie: [] }]
paths:
  /auth/login:
    post:
      summary: Authenticate and start a rotated session
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password:
                  {
                    type: string,
                    minLength: 8,
                    maxLength: 200,
                    format: password,
                  }
      responses:
        "200": { description: Session cookie and MFA requirement }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Actor or IP rate limit exceeded }
  /auth/mfa/verify:
    post:
      summary: Verify TOTP for a pending administrative session
      operationId: verifyMfa
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties: { code: { type: string, pattern: "^\\d{6}$" } }
      responses:
        "200": { description: MFA verified }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      summary: Revoke the current session
      operationId: logout
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "200": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/sessions:
    get:
      summary: List active sessions owned by the current user
      operationId: listSessions
      responses:
        "200": { description: Active sessions without token material }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/sessions/{id}:
    delete:
      summary: Revoke an owned session
      operationId: revokeSession
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      responses:
        "200": { description: Session revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/password/forgot:
    post:
      summary: Request password reset without disclosing account existence
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "200": { description: Request accepted regardless of account existence }
        "429": { description: Actor or IP rate limit exceeded }
  /auth/password/reset:
    post:
      summary: Consume a one-time password reset token
      operationId: resetPassword
      security: []
      requestBody: { $ref: "#/components/requestBodies/TokenPassword" }
      responses:
        "200": { description: Password changed and sessions revoked }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /auth/activate:
    post:
      summary: Activate an account using a one-time token
      operationId: activateAccount
      security: []
      requestBody: { $ref: "#/components/requestBodies/TokenPassword" }
      responses:
        "200": { description: Account activated }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /auth/reauthenticate:
    post:
      summary: Re-authenticate before a sensitive operation
      operationId: reauthenticate
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                {
                  password:
                    {
                      type: string,
                      minLength: 12,
                      maxLength: 200,
                      format: password,
                    },
                }
      responses:
        "200": { description: Re-authentication valid for five minutes }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/mfa/enroll:
    post:
      summary: Begin TOTP enrollment for the current user
      operationId: beginMfaEnrollment
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "200": { description: TOTP provisioning URI }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/mfa/enroll/confirm:
    post:
      summary: Confirm TOTP enrollment and issue recovery codes once
      operationId: confirmMfaEnrollment
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties: { code: { type: string, pattern: "^\\d{6}$" } }
      responses:
        "200": { description: One-time recovery code list }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/mfa/recovery/verify:
    post:
      summary: Consume one MFA recovery code
      operationId: verifyMfaRecoveryCode
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                { code: { type: string, minLength: 8, maxLength: 64 } }
      responses:
        "200": { description: MFA verified and recovery code consumed }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /health/live:
    get:
      summary: Check process liveness
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: Process is live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /students/{studentId}/bank-account:
    parameters: [{ $ref: "#/components/parameters/StudentId" }]
    get:
      summary: Read the active bank account with protected fields masked
      operationId: getBankAccount
      responses:
        "200": { description: Masked active bank account }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Create or replace the caller's own encrypted bank account
      operationId: saveBankAccount
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountInput" }
      responses:
        "200": { description: Masked pending-review account }
        "412": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /students/{studentId}/bank-account/review:
    parameters: [{ $ref: "#/components/parameters/StudentId" }]
    patch:
      summary: Validate or reject a pending bank account
      operationId: reviewBankAccount
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankReviewInput" }
      responses:
        "200": { description: Masked reviewed account }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /students/{studentId}/bank-account/reveal:
    parameters: [{ $ref: "#/components/parameters/StudentId" }]
    patch:
      summary: Reveal bank fields after re-authentication and append an audit event
      operationId: revealBankAccount
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose]
              properties:
                purpose: { type: string, minLength: 10, maxLength: 500 }
      responses:
        "200": { description: Full bank fields for immediate authorized use }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /health/ready:
    get:
      summary: Check dependency readiness
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Dependencies are ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /students:
    get:
      summary: List students in the caller data scope
      operationId: listStudents
      parameters:
        - {
            in: query,
            name: page,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            in: query,
            name: size,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        "200": { description: Scoped student page }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create a student after duplicate checks
      operationId: createStudent
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentInput" }
      responses:
        "200": { description: Student created }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
  /configuration/{kind}:
    parameters:
      - in: path
        name: kind
        required: true
        schema: { type: string, enum: [schools, programs, periods, calendar] }
    get:
      summary: List operational configuration records
      operationId: listConfiguration
      responses:
        "200":
          {
            description: Configuration records visible to an authorized manager,
          }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create an operational configuration record
      operationId: createConfiguration
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigurationInput" }
      responses:
        "200": { description: Created configuration record }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /configuration/{kind}/{id}:
    patch:
      summary: Optimistically update an operational configuration record
      operationId: updateConfiguration
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [schools, programs, periods, calendar] }
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigurationInput" }
      responses:
        "200": { description: Updated configuration record }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /students/{id}:
    get:
      summary: Get a field-filtered student
      operationId: getStudent
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      responses:
        {
          "200": { description: Masked field-policy detail },
          "404": { $ref: "#/components/responses/NotFound" },
        }
    patch:
      summary: Update allowed student fields
      operationId: updateStudent
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/StudentPatch" } },
          }
      responses:
        "200": { description: Updated student }
        "412": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /students/duplicates/check:
    get:
      summary: Find scoped exact duplicate candidates by normalized name and birth date
      operationId: checkStudentDuplicates
      parameters:
        - {
            in: query,
            name: full_name,
            required: true,
            schema: { type: string, minLength: 2, maxLength: 150 },
          }
        - {
            in: query,
            name: date_of_birth,
            required: true,
            schema: { type: string, format: date },
          }
      responses:
        "200": { description: Scoped duplicate candidates }
        "404": { $ref: "#/components/responses/NotFound" }
  /students/{id}/guardians:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    get:
      summary: List guardians with masked contact details
      operationId: listStudentGuardians
      responses:
        "200": { description: Guardian list with masked contacts }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Add an encrypted guardian contact
      operationId: addStudentGuardian
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/GuardianInput" } },
          }
      responses:
        "200": { description: Guardian created with masked contact }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /students/{id}/school-history:
    get:
      summary: List immutable school assignments for a scoped student
      operationId: listStudentSchoolHistory
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      responses:
        "200": { description: Effective-dated school history }
        "404": { $ref: "#/components/responses/NotFound" }
  /students/{id}/school-transfer:
    post:
      summary: Atomically transfer a student and append history/profile versions
      operationId: transferStudentSchool
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/StudentSchoolTransferInput" },
              },
          }
      responses:
        "200": { description: Transferred student }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /submissions/{id}/submit:
    post:
      summary: Submit an immutable academic version
      operationId: submitAcademicSubmission
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/ResourceId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [version],
                      properties: { version: { type: integer, minimum: 1 } },
                    },
                },
            },
        }
      responses:
        "200": { description: Immutable submitted version and receipt }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /submissions:
    get:
      summary: List submissions in the caller student or review scope
      operationId: listAcademicSubmissions
      parameters:
        [{ in: query, name: queue, schema: { type: boolean, default: false } }]
      responses:
        "200": { description: Scoped submissions or open review queue }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create a unique draft submission
      operationId: createAcademicSubmission
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema: { $ref: "#/components/schemas/SubmissionCreateInput" },
              },
          }
      responses:
        "200": { description: Draft submission created }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /submissions/{id}/draft:
    patch:
      summary: Optimistically save mutable draft data
      operationId: saveAcademicDraft
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/SubmissionDraftInput" } },
          }
      responses:
        "200": { description: Draft saved }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /submissions/{id}/review:
    post:
      summary: Complete the current scoped review task
      operationId: reviewAcademicSubmission
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema: { $ref: "#/components/schemas/SubmissionReviewInput" },
              },
          }
      responses:
        "200": { description: Review decision applied }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /students/{studentId}/education-expenses/{academicYear}:
    parameters:
      - { $ref: "#/components/parameters/StudentId" }
      - { $ref: "#/components/parameters/AcademicYear" }
    get:
      summary: Read a scoped yearly education-expense record
      operationId: getEducationExpense
      responses:
        "200": { description: Expense record }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Create or optimistically update an editable expense record
      operationId: saveEducationExpense
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EducationExpenseInput" }
      responses:
        "200": { description: Saved expense draft }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /students/{studentId}/education-expenses/{academicYear}/{action}:
    parameters:
      - { $ref: "#/components/parameters/StudentId" }
      - { $ref: "#/components/parameters/AcademicYear" }
      - in: path
        name: action
        required: true
        schema: { type: string, enum: [submit, return, confirm, correct] }
    post:
      summary: Apply an idempotent expense workflow transition
      operationId: transitionEducationExpense
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        "200": { description: Transition applied and version appended }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /students/{studentId}/support-programs:
    parameters: [{ $ref: "#/components/parameters/StudentId" }]
    get:
      summary: List active support occurrences in student scope
      operationId: listStudentSupportPrograms
      responses:
        "200": { description: Support occurrence list }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Add a support-program occurrence
      operationId: createStudentSupportProgram
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentSupportInput" }
      responses:
        "200": { description: Support occurrence created }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /students/{studentId}/support-programs/catalog:
    get:
      summary: List active support-program catalog entries
      operationId: listSupportProgramCatalog
      parameters: [{ $ref: "#/components/parameters/StudentId" }]
      responses:
        "200": { description: Localized support catalog }
        "404": { $ref: "#/components/responses/NotFound" }
  /students/{studentId}/support-programs/{id}:
    parameters:
      - { $ref: "#/components/parameters/StudentId" }
      - { $ref: "#/components/parameters/ResourceId" }
    put:
      summary: Optimistically update a support occurrence
      operationId: updateStudentSupportProgram
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentSupportInput" }
      responses:
        "200": { description: Support occurrence updated }
        "412": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: Archive a support occurrence while preserving history
      operationId: archiveStudentSupportProgram
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses:
        "200": { description: Support occurrence archived }
        "412": { $ref: "#/components/responses/Conflict" }
  /manual-transfers:
    get:
      summary: List transfers in the caller's program, school or student scope
      operationId: listManualTransfers
      responses:
        "200": { description: Scoped transfer page }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Record an externally executed transfer
      operationId: createManualTransfer
      description: Records an external transfer; never initiates payment.
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/ManualTransferInput" },
                },
            },
        }
      responses:
        "200": { description: Awaiting student confirmation }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /manual-transfers/{id}:
    get:
      summary: Read a scoped transfer with confirmation and correction evidence
      operationId: getManualTransfer
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      responses:
        "200": { description: Transfer detail }
        "404": { $ref: "#/components/responses/NotFound" }
  /manual-transfers/{id}/confirm:
    post:
      summary: Confirm receipt or report non-receipt as the linked student
      operationId: confirmManualTransfer
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferConfirmationInput" }
      responses:
        "200": { description: Confirmation recorded append-only }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/NotFound" }
  /manual-transfers/{id}/corrections:
    post:
      summary: Mark the original corrected and create an immutable replacement
      operationId: correctManualTransfer
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferCorrectionInput" }
      responses:
        "200": { description: Replacement transfer created }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /documents/upload-init:
    post:
      summary: Create a private quarantine upload with a short-lived signed URL
      operationId: initiateDocumentUpload
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/DocumentUploadInput" } },
          }
      responses:
        "200":
          { description: Signed quarantine upload URL and required headers }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /documents/{id}/complete:
