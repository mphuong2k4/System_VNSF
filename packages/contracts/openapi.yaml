      operationId: revealStudentIdentity
      parameters: [{ $ref: "#/components/parameters/StudentId" }]
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "200": { description: Revealed identity number }
        "403": { description: Break-glass scope required }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vnsf_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  requestBodies:
    TokenPassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [token, password]
            properties:
              token: { type: string, minLength: 32, maxLength: 200 }
              password:
                {
                  type: string,
                  minLength: 12,
                  maxLength: 200,
                  format: password,
                }
  parameters:
    AcademicYear:
      {
        in: path,
        name: academicYear,
        required: true,
        schema: { type: string, pattern: "^20[0-9]{2}-20[0-9]{2}$" },
      }
    StudentId:
      {
        in: path,
        name: studentId,
        required: true,
        schema: { type: string, format: uuid },
      }
    ResourceId:
      {
        in: path,
        name: id,
        required: true,
        schema: { type: string, format: uuid },
      }
    IfMatch:
      {
        in: header,
        name: If-Match,
        required: true,
        schema: { type: string },
        example: '"3"',
      }
    IdempotencyKey:
      {
        in: header,
        name: Idempotency-Key,
        required: true,
        schema: { type: string, minLength: 16, maxLength: 128 },
      }
  schemas:
    DocumentUploadInput:
      type: object
      additionalProperties: false
      required:
        [
          owner_type,
          owner_id,
          purpose,
          filename,
          size_bytes,
          mime_type,
          checksum_sha256,
        ]
      properties:
        owner_type:
          {
            type: string,
            enum: [STUDENT, SUBMISSION, EDUCATION_EXPENSE, THANK_YOU_LETTER],
          }
        owner_id: { type: string, format: uuid }
        purpose: { type: string, minLength: 2, maxLength: 40 }
        filename: { type: string, minLength: 1, maxLength: 255 }
        size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
        mime_type:
          { type: string, enum: [application/pdf, image/jpeg, image/png] }
        checksum_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    SubmissionCreateInput:
      type: object
      additionalProperties: false
      required: [student_id, period_id, type]
      properties:
        student_id: { type: string, format: uuid }
        period_id: { type: string, format: uuid }
        type: { type: string, minLength: 2, maxLength: 30 }
    SubmissionDraftInput:
      type: object
      additionalProperties: false
      required: [payload]
      properties:
        payload:
          type: object
          additionalProperties: false
          required: [academic_year, term, gpa_value, gpa_scale]
          properties:
            academic_year: { type: string, pattern: "^\\d{4}-\\d{4}$" }
            term: { type: string, minLength: 1, maxLength: 50 }
            gpa_value: { type: number, minimum: 0, maximum: 100 }
            gpa_scale: { type: number, exclusiveMinimum: 0, maximum: 100 }
            credits: { type: number, minimum: 0, maximum: 500 }
            classification: { type: string, minLength: 1, maxLength: 100 }
            notes: { type: string, maxLength: 2000 }
    SubmissionReviewInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVE, RETURN, REJECT] }
        reason_code: { type: string, minLength: 2, maxLength: 50 }
        note: { type: string, maxLength: 2000 }
    ConfigurationInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [code, name]
          properties:
            code: { type: string, minLength: 2, maxLength: 30 }
            name: { type: string, minLength: 2, maxLength: 150 }
            active: { type: boolean }
        - type: object
          additionalProperties: false
          required: [code, name, workflow_type]
          properties:
            code: { type: string, minLength: 2, maxLength: 30 }
            name: { type: string, minLength: 2, maxLength: 150 }
            workflow_type: { type: string, enum: [ONE_LEVEL, TWO_LEVEL] }
            self_service_mode:
              {
                type: [string, "null"],
                enum: [SCHOOL_MANAGED, STUDENT_MANAGED, HYBRID, null],
              }
            self_service_min_grade: { type: integer, minimum: 1, maximum: 12 }
            active: { type: boolean }
        - type: object
          additionalProperties: false
          required: [program_id, code, due_at, timezone, workflow_type]
          properties:
            program_id: { type: string, format: uuid }
            code: { type: string, minLength: 2, maxLength: 30 }
            opens_at: { type: [string, "null"], format: date-time }
            due_at: { type: string, format: date-time }
            timezone: { type: string, enum: [Asia/Ho_Chi_Minh] }
            workflow_type: { type: string, enum: [ONE_LEVEL, TWO_LEVEL] }
        - type: object
          additionalProperties: false
          required: [calendar_date, day_type, name]
          properties:
            calendar_date: { type: string, format: date }
            day_type: { type: string, enum: [HOLIDAY, WORKING_DAY] }
            name: { type: string, minLength: 2, maxLength: 150 }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, correlation_id]
      properties:
        status: { type: string, enum: [ok] }
        correlation_id: { type: string, format: uuid }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }
        params: { type: object, additionalProperties: true }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message_key, field_errors, correlation_id]
      properties:
        code: { type: string, example: VERSION_CONFLICT }
        message_key: { type: string, example: errors.versionConflict }
        field_errors:
          { type: array, items: { $ref: "#/components/schemas/FieldError" } }
        correlation_id: { type: string, format: uuid }
    StudentInput:
      type: object
      additionalProperties: false
      required:
        [student_code, full_name, date_of_birth, program_id, current_school_id]
      properties:
        student_code: { type: string, minLength: 3, maxLength: 30 }
        full_name: { type: string, minLength: 1, maxLength: 150 }
        date_of_birth: { type: string, format: date }
        program_id: { type: string, format: uuid }
        current_school_id: { type: string, format: uuid }
        grade_level_current: { type: integer, minimum: 1, maximum: 12 }
        duplicate_override_reason:
          { type: string, minLength: 10, maxLength: 500 }
    StudentPatch:
      type: object
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 1, maxLength: 150 }
        date_of_birth: { type: string, format: date }
        grade_level_current: { type: integer, minimum: 1, maximum: 12 }
    GuardianInput:
      type: object
      additionalProperties: false
      required: [full_name, relationship]
      anyOf: [{ required: [phone] }, { required: [email] }]
      properties:
        full_name: { type: string, minLength: 2, maxLength: 150 }
        relationship: { type: string, enum: [MOTHER, FATHER, GUARDIAN, OTHER] }
        is_primary: { type: boolean, default: false }
        phone: { type: string, minLength: 8, maxLength: 20 }
        email: { type: string, format: email }
    StudentSchoolTransferInput:
      type: object
      additionalProperties: false
      required: [target_school_id, effective_from, reason]
      properties:
        target_school_id: { type: string, format: uuid }
        effective_from: { type: string, format: date }
        reason: { type: string, minLength: 10, maxLength: 500 }
    EducationExpenseInput:
      type: object
      additionalProperties: false
      properties:
        vnd_per_term: { type: [string, "null"], pattern: '^\d+(\.\d{1,2})?$' }
        vnd_per_year: { type: [string, "null"], pattern: '^\d+(\.\d{1,2})?$' }
        usd_amount: { type: [string, "null"], pattern: '^\d+(\.\d{1,2})?$' }
        liability: { type: [string, "null"], pattern: '^\d+(\.\d{1,2})?$' }
        tutoring_money: { type: [string, "null"], pattern: '^\d+(\.\d{1,2})?$' }
        notes: { type: [string, "null"], maxLength: 4000 }
    StudentSupportInput:
      type: object
      additionalProperties: false
      required: [program_code, received, currency, status]
      properties:
        program_code: { type: string, minLength: 2, maxLength: 30 }
        received: { type: boolean }
        received_date: { type: [string, "null"], format: date }
        support_value: { type: [string, "null"], pattern: '^\d+(\.\d{1,2})?$' }
        currency: { type: string, enum: [VND, USD] }
        status: { type: string, enum: [PLANNED, ACTIVE, COMPLETED, CANCELLED] }
        notes: { type: [string, "null"], maxLength: 4000 }
    ManualTransferInput:
      type: object
      additionalProperties: false
      required:
        [
          student_id,
          period_id,
          transfer_type,
          amount,
          currency,
          transferred_at,
          reference,
        ]
      properties:
        student_id: { type: string, format: uuid }
        period_id: { type: string, format: uuid }
        transfer_type: { type: string }
        amount: { type: string, pattern: '^\\d+(\\.\\d{1,2})?$' }
        currency: { type: string, enum: [VND, USD] }
        transferred_at: { type: string, format: date-time }
        reference: { type: string }
    TransferConfirmationInput:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result: { type: string, enum: [RECEIVED, NOT_RECEIVED] }
        note: { type: string, maxLength: 1000 }
    TransferCorrectionInput:
      type: object
      additionalProperties: false
      required:
        [
          transfer_type,
          amount,
          currency,
          transferred_at,
          reference,
          reason_code,
          reason,
        ]
      properties:
        transfer_type: { type: string, minLength: 1, maxLength: 30 }
        amount: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
        currency: { type: string, enum: [VND, USD] }
        transferred_at: { type: string, format: date-time }
        reference: { type: string, minLength: 1, maxLength: 100 }
        reason_code: { type: string, minLength: 2, maxLength: 50 }
        reason: { type: string, minLength: 10, maxLength: 1000 }
    BankAccountInput:
      type: object
      additionalProperties: false
      required: [account_name, account_number, bank_code]
      properties:
        account_name: { type: string, minLength: 2, maxLength: 150 }
        account_number: { type: string, pattern: "^[0-9 -]{6,40}$" }
        bank_code: { type: string, pattern: "^[A-Z0-9_-]{2,20}$" }
    BankReviewInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [VALIDATED, REJECTED] }
        reason: { type: string, minLength: 10, maxLength: 500 }
  responses:
    ServiceUnavailable:
      description: Dependency unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      {
        description: Authentication or MFA required,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ErrorResponse" } },
          },
      }
    NotFound:
      {
        description: Missing or concealed by scope,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ErrorResponse" } },
          },
      }
    Conflict:
      {
        description: "Duplicate, state or version conflict",
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ErrorResponse" } },
          },
      }
    ValidationFailed:
      {
        description: Business validation failed,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ErrorResponse" } },
          },
      }
    PreconditionRequired:
      {
        description: If-Match/version is required,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ErrorResponse" } },
          },
      }
    BadRequest:
      {
        description: Malformed request,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ErrorResponse" } },
          },
      }
