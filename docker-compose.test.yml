services:
  postgres-test:
    {
      image: postgres:16-alpine,
      environment:
        {
          POSTGRES_USER: vnsf,
          POSTGRES_PASSWORD: test_only,
          POSTGRES_DB: vnsf_test,
        },
      ports: ["55432:5432"],
    }
  redis-test: { image: redis:7-alpine, ports: ["56379:6379"] }
  minio-test:
    {
      image: minio/minio:latest,
      command: server /data,
      environment:
        { MINIO_ROOT_USER: testtest, MINIO_ROOT_PASSWORD: test-test-secret },
      ports: ["59000:9000"],
    }
