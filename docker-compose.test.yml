services:
  postgres-test:
    {
      image: postgres:16-alpine,
      environment:
        {
          POSTGRES_USER: vnsf,
          POSTGRES_PASSWORD: test_only,
          POSTGRES_DB: vnsf_test,
        },
      ports: ["55433:5432"],
      healthcheck:
        {
          test: [CMD-SHELL, "pg_isready -U vnsf -d vnsf_test"],
          interval: 5s,
          timeout: 3s,
          retries: 20,
        },
    }
  redis-test:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 20 }
  minio-test:
    {
      image: minio/minio:latest,
      command: server /data,
      environment:
        { MINIO_ROOT_USER: testtest, MINIO_ROOT_PASSWORD: test-test-secret },
      ports: ["59000:9000"],
    }
  minio-test-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio-test]
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "until mc alias set test http://minio-test:9000 testtest test-test-secret; do sleep 2; done; mc mb --ignore-existing test/vnsf-test; mc anonymous set none test/vnsf-test",
      ]
  mailpit-test:
    image: axllent/mailpit:latest
    ports: ["51025:1025", "58025:8025"]
  clamav-test:
    image: clamav/clamav:stable
    ports: ["53310:3310"]
