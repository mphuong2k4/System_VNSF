name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        {
          image: "postgres:16-alpine",
          env:
            {
              POSTGRES_USER: vnsf,
              POSTGRES_PASSWORD: test,
              POSTGRES_DB: vnsf_test,
            },
          ports: ["5432:5432"],
        }
      redis: { image: "redis:7-alpine", ports: ["6379:6379"] }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm lint && pnpm typecheck
      - run: pnpm test && pnpm build
      - run: pnpm contracts:validate
      - run: git diff --exit-code
      - run: docker build --target api -f infra/docker/Dockerfile .
      - uses: gitleaks/gitleaks-action@v2
      - run: pnpm audit --audit-level high

  integration:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f docker-compose.test.yml up -d
      - name: Wait for test dependencies
        run: |
          for attempt in $(seq 1 60); do
            if docker compose -f docker-compose.test.yml ps --status running | grep -q postgres-test && nc -z 127.0.0.1 53310; then exit 0; fi
            sleep 5
          done
          docker compose -f docker-compose.test.yml ps
          exit 1
      - name: Migrate and run integrations
        env:
          APP_ENV: test
          APP_BASE_URL: http://localhost:5173
          APP_TIMEZONE: Asia/Ho_Chi_Minh
          SUPPORTED_LOCALES: vi-VN,en-US
          DATABASE_URL: postgresql://vnsf:test_only@127.0.0.1:55433/vnsf_test
          REDIS_URL: redis://127.0.0.1:56379
          SESSION_SECRET_CURRENT: integration-current-secret-at-least-32-chars
          SESSION_SECRET_PREVIOUS: integration-previous-secret-at-least-32-chars
          FIELD_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          FIELD_HMAC_KEY_BASE64: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
          OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:59000
          OBJECT_STORAGE_BUCKET: vnsf-test
          OBJECT_STORAGE_ACCESS_KEY: testtest
          OBJECT_STORAGE_SECRET_KEY: test-test-secret
          EMAIL_PROVIDER: smtp
          EMAIL_FROM: test@vnsf.local
          SMTP_URL: smtp://127.0.0.1:51025
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: "53310"
          RUN_INTEGRATION: "true"
        run: pnpm build && pnpm db:migrate && pnpm test:integration
      - if: always()
        run: docker compose -f docker-compose.test.yml logs --no-color > integration-compose.log && docker compose -f docker-compose.test.yml down -v
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-diagnostics
          path: integration-compose.log

  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vnsf/web exec playwright install --with-deps chromium
      - run: cp .env.example .env && docker compose up -d --build
      - name: Wait for application
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/v1/health/ready; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs api
          exit 1
      - name: Seed synthetic browser account
        env:
          APP_ENV: test
          E2E_ALLOW_SEED: "true"
          DATABASE_URL: postgresql://vnsf:vnsf_dev_only@127.0.0.1:5432/vnsf
        run: pnpm --filter @vnsf/api seed:e2e
      - run: pnpm test:e2e
      - if: always()
        run: docker compose logs --no-color > compose.log && docker compose down -v
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            compose.log
            apps/web/playwright-report
            apps/web/test-results
