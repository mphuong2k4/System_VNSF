name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        {
          image: "postgres:16-alpine",
          env:
            {
              POSTGRES_USER: vnsf,
              POSTGRES_PASSWORD: test,
              POSTGRES_DB: vnsf_test,
            },
          ports: ["5432:5432"],
        }
      redis: { image: "redis:7-alpine", ports: ["6379:6379"] }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm lint && pnpm typecheck
      - run: pnpm test && pnpm test:integration && pnpm build
      - run: pnpm contracts:validate
      - run: git diff --exit-code
      - run: docker build --target api -f infra/docker/Dockerfile .
      - uses: gitleaks/gitleaks-action@v2
      - run: pnpm audit --audit-level high
